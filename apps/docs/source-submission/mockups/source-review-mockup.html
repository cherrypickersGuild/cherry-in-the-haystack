/* 분석 상태 — 버튼을 눌러야 시작한다(D2 = 버튼).
   파이프라인이 문단마다 LLM 을 부르므로 즉시 끝나지 않는다. 그래서 '진행 중' 이 따로 있다. */
/* 상태는 넷뿐이다. 대기열이 없으므로 QUEUED 도 없다 —
   동시에 하나만 돌고, 이미 돌고 있으면 "이미 분석 중입니다" 로 돌려보낸다(기획 §4-B). */
const AN = { NONE:["안 함","tg-none"], RUNNING:["진행 중","tg-run"],
             DONE:["완료","tg-done"], FAILED:["실패","tg-fail"] };
const STEPS = ["글자 뽑기","챕터 나누기","문단 자르기","개념 뽑기 (LLM)","기존 개념과 대조","요약·경고 정리 (LLM)"];
let anStep = 0, anTimer = null;
const STCLS = { PENDING:"st-wait", HOLD:"st-hold", APPROVED:"st-ok", REJECTED:"st-no" };

/* 링크와 파일은 처리 방식이 아예 다르다 — 목록부터 가른다.
   파일 : 원문을 보고 분석을 돌려 승인한다
   링크 : 본문이 없으므로 체크해서 조사 목록으로 내보낸다 */
let kind="FILE", state="ALL", curId=1, rtab="meta", checked=new Set();
/* 보관 기간은 아직 안 정했다(D5). 대신 며칠 지났는지를 보여준다. */
const TODAY = new Date("2026-09-14");
const daysAgo = (at) => Math.round((TODAY - new Date(at.slice(0,10))) / 86400000);
const ago = (at) => { const n = daysAgo(at); return n <= 0 ? "오늘" : n + "일 지남"; };
/* 원문을 실제로 불러온 투고만 담는다.
   PDF 는 수 MB 라 열자마자 내려받으면 화면이 그만큼 늦게 뜬다.
   [원문 보기] 를 누른 뒤에만 받는다. */
const opened = new Set();
const isFile = d => d.kind !== 'URL';
const inKind = d => (kind === 'URL') === (d.kind === 'URL');
const STATES = ["ALL","PENDING","HOLD","APPROVED","REJECTED"];
const SLABEL = { ALL:"전체", PENDING:"대기", HOLD:"유보", APPROVED:"승인", REJECTED:"반려" };

const cur = () => DATA.find(d => d.id === curId) || null;

function drawRows(){
  document.getElementById('nFile').textContent = DATA.filter(d => !d.kind.includes('URL')).length;
  document.getElementById('nUrl').textContent  = DATA.filter(d =>  d.kind === 'URL').length;

  /* 상태 칩 — 지금 고른 종류 안에서만 센다 */
  const pool = DATA.filter(inKind);
  document.getElementById('stateChips').innerHTML = STATES
    .filter(st => st === 'ALL' || pool.some(d => d.state === st))
    .map(st => {
      const n = st === 'ALL' ? pool.length : pool.filter(d => d.state === st).length;
      return `<button class="${state===st?'on':''}" data-st="${st}">${SLABEL[st]}<span class="n">${n}</span></button>`;
    }).join('');

  const items = pool.filter(d => state === 'ALL' || d.state === state);
  document.getElementById('cnt').textContent = items.length + '건';

  document.getElementById('rows').innerHTML = items.length ? items.map(d => `
    <div class="row ${d.id===curId?'on':''}" data-id="${d.id}">
      ${kind === 'URL' ? `<input type="checkbox" data-check="${d.id}" ${checked.has(d.id)?'checked':''}>` : ''}
      <div class="body">
        <div class="t">${d.title}</div>
        <div class="m">${kind==='URL' ? '' : `<span class="kind f">${d.kind}</span>`}
          <span>${d.by}</span><span>${ago(d.at)}</span>
          <span class="st ${STCLS[d.state]}">${LABEL[d.state]}</span>
          ${kind==='URL' ? '' : `<span class="tg ${AN[d.an][1]}">분석 ${AN[d.an][0]}</span>`}</div>
      </div>
    </div>`).join('') : '<div class="empty">없습니다.</div>';

  /* 아래 버튼 줄 — 링크 목록에서만 쓴다 */
  document.getElementById('lfoot').innerHTML = kind === 'URL'
    ? `<span id="selCount">선택 ${checked.size}건</span>
       <button class="btn s" id="btnExport" style="margin-left:auto" ${checked.size?'':'disabled'}>JSON 내보내기</button>
       <button class="btn s" disabled style="opacity:.4" title="다음 범위">가져오기</button>`
    : `<span>파일은 하나씩 열어 분석 결과를 보고 판단합니다</span>`;
  const ex = document.getElementById('btnExport');
  if(ex){ ex.style.opacity = checked.size ? 1 : .45;
    ex.onclick = () => { rtab = 'export'; drawRight() }; }
}

/* ── 오른쪽 탭 본문 ── */
function paneDoc(d){
  if(d.kind === 'URL') return `
    <div class="sec">링크</div>
    <div style="border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--hover)">
      <a href="${d.meta}" target="_blank" rel="noreferrer"
         style="font-size:13px;color:var(--accent-ink);word-break:break-all">${d.meta} ↗</a>
      <div class="hint" style="margin-top:8px">남의 서버에 있는 자료라 이 자리에서 본문을 띄우지 않습니다.</div>
    </div>
    <div class="sec">투고자가 쓴 말</div>
    <p style="font-size:13px">${d.note || '—'}</p>
`;

  /* 아직 안 받았으면 파일 정보만 보여주고 기다린다 */
  if(!opened.has(d.id)) return `
    <div class="sec">첨부된 파일</div>
    <div class="picked" style="margin-bottom:14px">
      <span class="kind f">${d.kind}</span>
      <div><div class="t">${d.name}</div><div class="m">${d.meta}</div></div>
    </div>
    <button class="btn a" id="btnOpen">원문 보기</button>
    <p class="hint" style="margin-top:10px">
      ${d.kind === 'PDF'
        ? '누르면 그때 파일을 받아 띄웁니다. 4.2 MB 라 몇 초 걸립니다.'
        : '누르면 그때 파일을 받아 글자 그대로 띄웁니다.'}<br>
      열자마자 받지 않는 이유 — 목록을 넘겨보기만 할 때도 매번 파일을 통째로 내려받게 됩니다.
    </p>
    <div style="margin-top:12px"><button class="btn s">받지 않고 내려받기</button></div>`;

  if(d.kind === 'MD') return `
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="sec">원문 — ${d.name}</div>
      <div class="viewer md" style="flex:1">${(d.body||'').replace(/</g,'&lt;')}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <button class="btn s">내려받기</button>
        <span class="hint" style="margin:0">꾸미지 않고 글자 그대로 보여줍니다</span>
      </div>
    </div>`;

  return `
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="sec">원문 — ${d.name}</div>
      <div class="viewer" style="flex:1">PDF 뷰어 — 340쪽</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <button class="btn s">내려받기</button>
        <span class="hint" style="margin:0">격리된 틀에서 띄웁니다 — 문서 안 스크립트는 실행되지 않습니다</span>
      </div>
    </div>`;
}

function paneLoad(d){

  if(d.an !== 'DONE')
    return `<div class="empty">분석이 끝나야 무엇이 들어갈지 알 수 있습니다.<br>
      [투고 정보] 에서 분석을 먼저 돌리세요.</div>`;

  const KIND = { "값":"lv-val", "기본":"lv-def", "빈칸":"lv-nul", "생성":"lv-gen" };
  const val = (v) => typeof v === 'function' ? v(d) : v;

  return `
    <div class="hint" style="margin:0 0 10px">
      적재는 <b>두 단계</b>입니다. 칼럼은 <b>라이브 DB 에서 읽은 실제 칼럼 전부</b>이고, 순서도 DB 순서 그대로입니다.

      </div>
      <p class="hint" style="margin-top:8px">
        <b>②는 자동으로 되지 않습니다.</b> 옮기기를 따로 실행해야 화면에 나옵니다.</p>

      <div class="cline"><b>public.books</b><span class="lv lv-val">1행</span><span>title · author · source_path · processing_status · total_paragraphs</span></div>

      <span><i class="lv-val"></i>값 — 분석이 뽑은 것</span>
      <span><i class="lv-def"></i>기본 — DB 기본값</span>

<pre>{
  <span class="k2">"count"</span>: <span class="s">${sel.length}</span>,
  <span class="k2">"items"</span>: [
${sel.map(x => `    {
      <span class="c">// 읽기 전용</span>
      <span class="k2">"url"</span>: <span class="s">"${x.meta}"</span>,
      <span class="k2">"submittedBy"</span>: <span class="s">"${x.by}"</span>,
      <span class="k2">"submitterNote"</span>: <span class="s">"${x.note||''}"</span>,

      <span class="c">// 반드시 채워야 하는 것 3개 — DB 가 NOT NULL 이고 기본값이 없다</span>
      <span class="k2">"type"</span>: null,        <span class="c">// RSS · WEBSITE · YOUTUBE · …</span>
      <span class="k2">"name"</span>: null,
      <span class="k2">"urlHandle"</span>: null,   <span class="c">// 실제로 수집할 주소. RSS 면 RSS 주소</span>

      <span class="c">// 비워도 되는 것</span>
      <span class="k2">"frequency"</span>: null,   <span class="c">// 비우면 DAILY (DB 기본값)</span>
      <span class="k2">"description"</span>: null,
      <span class="k2">"homepageUrl"</span>: null,
      <span class="k2">"language"</span>: null,
      <span class="k2">"verdict"</span>: null      <span class="c">// ADD · SKIP</span>
    }`).join(',\n')}
  ]
}</pre>`;
}

  if(d.kind === 'URL') return `<div class="empty">링크는 본문을 받아오지 않으므로 분석하지 않습니다.<br>조사자가 조사한 뒤 등록합니다.</div>`;

  if(d.an === 'NONE') return `
    <div class="abox">
      <p style="font-size:13px;font-weight:600;color:var(--ink)">아직 분석하지 않았습니다.</p>
      <p class="hint" style="margin-top:6px">[투고 정보] 탭의 <b>[분석하기]</b> 를 눌러 시작합니다.</p>
    </div>`;

  if(d.an === 'RUNNING') return `
    <div class="abox run">
      <p style="font-size:13px;font-weight:700;color:var(--accent-ink)">분석 중 — ${anStep+1} / ${STEPS.length} 단계</p>
      <div class="bar"><i style="width:${Math.round((anStep)/STEPS.length*100)}%"></i></div>
      <ul class="steps">${STEPS.map((t,i) => `
        <li class="${i<anStep?'done':i===anStep?'now':''}"><b>${i<anStep?'✓':i===anStep?'▸':'·'}</b>${t}</li>`).join('')}</ul>
      <p class="hint" style="margin-top:10px">
        4단계에서 문단 묶음마다 LLM 을 부르기 때문에 시간이 걸립니다.<br>이 화면을 떠나도 계속 돌아갑니다 — 다른 투고를 보고 있어도 됩니다.</p>
    </div>`;

  if(d.an === 'FAILED') return `
    <div class="abox fail">
      <p style="font-size:13px;font-weight:700;color:var(--red)">분석 실패</p>
      <p style="font-size:13px;margin-top:6px">${d.anErr || '알 수 없는 이유로 멈췄습니다.'}</p>
    </div>
    <div style="margin-top:14px"><button class="btn a" id="btnAnalyze">다시 시도</button></div>`;

  const a = d.a;
  return `
    <div class="sec">문서가 어떻게 들어가는가</div>
    <dl class="k">
      <dt>구조</dt><dd>${a.struct}</dd>
      <dt>개념</dt><dd>${a.concepts}</dd>
      <dt>새 개념</dt><dd class="new">${a.neu}</dd>
      <dt>중복</dt><dd>${a.dup}</dd>
      <dt>경고</dt><dd class="warn2">${a.warn}</dd>
    </dl>
    <div class="sec">요약</div>
    <ul class="lines">${a.sum.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="sec">근거 후보 (체리)</div>
    <ul class="lines">${a.cherry.map(c=>`<li>“${c[0]}” <span class="loc">${c[1]}</span></li>`).join('')}</ul>
    <div class="hint" style="margin-top:18px">
      이 결과는 <b>보여주기만</b> 합니다 — 승인해도 어느 표에도 행이 생기지 않습니다.<br>
      판단용 미리보기라, 실제 적재는 파이프라인이 다시 돌려 숫자가 조금 달라질 수 있습니다.</div>`;
}

function paneMeta(d){
  return `
    ${d.kind !== 'URL' ? `
      <div class="sec">첨부된 파일</div>
      <div class="picked" style="margin-bottom:4px">
        <span class="kind f">${d.kind}</span>
        <div><div class="t">${d.name}</div><div class="m">${d.meta}</div></div>
        <button class="btn s" id="btnOpen2" style="margin-left:auto">원문 보기</button>
      </div>
      <p class="hint">원문은 누를 때 받습니다 — 목록만 넘겨볼 때 파일을 내려받지 않습니다</p>

      <div class="sec">업로드 검사</div>
      <dl class="k">
        <dt>형식</dt><dd>진짜 ${d.kind} 맞음 — 파일 선두를 확인했습니다</dd>
        <dt>크기</dt><dd>${d.meta.split(' · ')[0]} · 한도 안</dd>
        <dt>해시</dt><dd style="font-family:ui-monospace,Menlo,monospace;font-size:11px">
          9f2c…a71b · 같은 파일 없음</dd>
        <dt>악성코드</dt><dd class="warn2">검사하지 않았습니다 — 추가 대응할 예정입니다</dd>
      </dl>
    ` : `
      <div class="sec">주소</div>
      <a href="${d.meta}" target="_blank" rel="noreferrer"
         style="font-size:13px;color:var(--accent-ink);word-break:break-all">${d.meta} ↗</a>
    `}

    <div class="sec">유저가 올린 제목</div>
    <p style="font-size:14px;font-weight:600;color:var(--ink)">${d.title}</p>

    <div class="sec">유저가 쓴 설명</div>
    <p style="font-size:13px">${d.note || '—'}</p>

    <div class="sec">투고</div>
    <dl class="k">
      <dt>투고자</dt><dd>${d.by}</dd>
      <dt>올린 때</dt><dd>${d.at} <span style="color:var(--dim2)">· ${ago(d.at)}</span></dd>
      <dt>상태</dt><dd class="st ${STCLS[d.state]}">${LABEL[d.state]}</dd>
    </dl>

    ${d.kind === 'URL' ? '' : `
      <div class="sec">분석</div>
      ${d.an === 'NONE' ? `
        <div class="abox">
          <p style="font-size:13px">아직 돌리지 않았습니다.</p>
          <p class="hint" style="margin-top:6px">
            문단을 자른 뒤 묶음마다 LLM 을 불러 개념을 뽑습니다. 이 문서는 문단이 많아 몇 분 걸립니다 —
            <b>볼 가치가 있다고 판단했을 때 누릅니다.</b> 누르면 호출한 만큼 비용이 나갑니다.</p>
          <div style="margin-top:12px"><button class="btn a" id="btnAnalyze">분석하기</button></div>
        </div>`
      : d.an === 'RUNNING' ? `
        <div class="abox run">
          <p style="font-size:13px;font-weight:700;color:var(--accent-ink)">
            분석 중 — ${STEPS[anStep]} (${anStep+1}/${STEPS.length})</p>
          <div class="bar"><i style="width:${Math.round(anStep/STEPS.length*100)}%"></i></div>
          <p class="hint">끝나면 [분석 정보] 탭에서 봅니다. 이 화면을 떠나도 계속 돌아갑니다.</p>
        </div>`
      : d.an === 'FAILED' ? `
        <div class="abox fail">
          <p style="font-size:13px;font-weight:700;color:var(--red)">분석 실패</p>
          <p style="font-size:13px;margin-top:6px">${d.anErr || ''}</p>
          <div style="margin-top:12px"><button class="btn a" id="btnAnalyze">다시 시도</button></div>
        </div>`
      : `
        <div class="abox">
          <p style="font-size:13px">분석이 끝났습니다 — <b>[분석 정보]</b> 탭에서 봅니다.</p>
          <p class="hint" style="margin-top:6px">${d.a.struct} · ${d.a.dup}</p>
        </div>`}
    `}

`;
}

function drawRight(){
  const d = cur();
  const box = document.getElementById('right');
  if(!d || !inKind(d) || (state !== 'ALL' && d.state !== state)){
    box.innerHTML = '<div class="empty">왼쪽 목록에서 하나를 고르세요.</div>'; return;
  }
  const [anTxt, anCls] = AN[d.an] || AN.NONE;
  const tabs = d.kind === 'URL'
    ? [["meta","투고 정보"], ["doc","링크"], ["export",`조사 목록 내보내기${checked.size?` (${checked.size})`:''}`]]
    : [["meta","투고 정보"], ["doc","원문"],
       ["analysis",`분석 정보<span class="tg ${anCls}">${anTxt}</span>`],
       ["load","적재 미리보기"]];
  if(!tabs.some(t => t[0] === rtab)) rtab = 'meta';
  const pane = rtab==='doc' ? paneDoc(d)
             : rtab==='export' ? paneExport()
             : rtab==='load' ? paneLoad(d)
             : rtab==='analysis' ? paneAnalysis(d) : paneMeta(d);
  /* 승인은 분석을 한 번 돌려본 뒤에만 — DONE 이든 FAILED 든(D9).
     스캔 PDF 는 글자를 못 뽑아 실패하지만, 그것과 자료 가치는 별개다.
     막는 것은 아직 안 돌린 것(NONE)과 도는 중(RUNNING)뿐이다. */
  const needAn = d.kind !== 'URL' && (d.an === 'NONE' || d.an === 'RUNNING');
  /* 되돌릴 수 있다 — 승인·반려한 뒤에도 다시 바꾼다(기획 §4-D).
     잘못 누른 것을 고칠 길이 없으면 관리자는 누르기를 망설인다. */
  /* 링크 승인은 "content.source 에 등록하기로 했다"는 표시일 뿐이다.
     실제 등록은 다음 범위 — 파일 승인이 적재 표시인 것과 같은 구조(기획 §4-D). */
  const done = d.state === 'APPROVED' || d.state === 'REJECTED';
  const foot = d.kind === 'URL'
      ? `<button class="btn ok">승인</button>
         <button class="btn hold">유보</button>
         <button class="btn no">반려</button>
         <span class="w">${done ? `지금 ${LABEL[d.state]} · 다시 눌러 바꿀 수 있습니다`
           : '승인은 "등록하기로 했다"는 표시입니다 — 등록은 다음에 붙입니다'}</span>`
      : `<button class="btn ok" ${needAn?'disabled style="opacity:.4;cursor:not-allowed"':''}>승인</button>
         <button class="btn hold">유보</button>
         <button class="btn no">반려</button>
         <span class="w">${needAn
           ? '분석을 한 번 돌려본 뒤에 승인할 수 있습니다 — [투고 정보] 에서 먼저 돌리세요'
           : done ? `지금 ${LABEL[d.state]} · 다시 눌러 바꿀 수 있습니다`
           : '[적재 미리보기] 로 무엇이 들어가는지 확인하세요 — 승인해도 어느 표에도 행이 생기지 않습니다'}</span>`;
  box.innerHTML = `
    <div class="rhead">
      <div class="top">
        <div>
          <h3>${d.title}</h3>
          <div class="sub"><span class="v">${d.kind}</span> · ${d.kind==='URL'?d.meta:d.name} · ${d.by} · ${d.at}
            <span style="color:var(--dim2)"> · ${ago(d.at)}</span></div>
        </div>
      </div>
      <div class="rtabs">${tabs.map(([k,l]) =>
        `<button class="${rtab===k?'on':''}" data-r="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="rbody">${pane}</div>
    <div class="rfoot">${foot}</div>`;

  box.querySelector('.rtabs').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    rtab = b.dataset.r; drawRight();
  };
  const an = document.getElementById('btnAnalyze');
  if(an) an.onclick = () => runAnalysis(curId);
  const open1 = document.getElementById('btnOpen');
  if(open1) open1.onclick = () => { opened.add(curId); drawRight(); };
  const open2 = document.getElementById('btnOpen2');
  if(open2) open2.onclick = () => { opened.add(curId); rtab = 'doc'; drawRight(); };
}

/* 버튼을 누르면 서버가 일을 맡아두고 화면은 바로 돌아온다(백그라운드 작업).
   목업이라 단계를 시간으로 흉내 낸다 — 실제로는 파이프라인이 단계마다 진행을 알려준다. */
function runAnalysis(id){
  const d = DATA.find(x => x.id === id); if(!d) return;
  clearInterval(anTimer);
  d.an = 'RUNNING'; anStep = 0; render();
  anTimer = setInterval(() => {
    anStep++;
    if(anStep >= STEPS.length){
      clearInterval(anTimer);
      d.an = 'DONE';
      d.a = d.a || DATA[0].a;     // 목업이라 같은 결과를 쓴다
      anStep = 0;
    }
    render();
  }, 800);
}

function render(){ drawRows(); drawRight(); }

function firstOf(){
  const f = DATA.filter(inKind).find(d => state === 'ALL' || d.state === state);
  curId = f ? f.id : 0;
}
document.getElementById('kindTabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#kindTabs button').forEach(t => t.classList.remove('on'));
  b.classList.add('on');
  kind = b.dataset.k; state = 'ALL'; rtab = 'meta'; firstOf(); render();
};
document.getElementById('stateChips').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  state = b.dataset.st; rtab = 'meta'; firstOf(); render();
};
document.getElementById('rows').onclick = e => {
  const cb = e.target.closest('input[data-check]');
  if(cb){ const id = +cb.dataset.check;
    checked.has(id) ? checked.delete(id) : checked.add(id); render(); return; }
  const r = e.target.closest('.row'); if(!r) return;
  curId = +r.dataset.id; rtab = 'meta'; render();
};
firstOf();
render();
</script>
</body>
</html>
