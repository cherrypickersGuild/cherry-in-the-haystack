<title>Multi-agent Orchestration</title>
<style>
/* 기존 개념 페이지(concept-reader-page.tsx)의 색·간격·구조를 그대로 쓴다.
   새로 만든 것은 ①한/영 토글 ②그림 구획뿐이다. */
:root{
  --page:#FBFAF8; --card:#FFFFFF; --border:#E4E1EE; --secondary:#F4F3F1;
  --text-primary:#1A1626; --text-secondary:#3D3652; --text-muted:#9E97B3;
  --cherry:#C94B6E; --cherry-soft:#FDF0F3; --cherry-border:#F0C3CF;
  --violet:#7B5EA7; --violet-soft:#F3EFFA; --violet-border:#D9CEEC;
  --green:#2F7A3A; --green-soft:#E3F1E1; --orange:#D4854A;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --page:#15131C; --card:#1D1A28; --border:#2F2B3E; --secondary:#242031;
    --text-primary:#F1EFF6; --text-secondary:#C7C1D5; --text-muted:#8A82A0;
    --cherry:#E9819C; --cherry-soft:#2B1A21; --cherry-border:#5A3442;
    --violet:#AB92D4; --violet-soft:#241D33; --violet-border:#463A62;
    --green:#5FBE95; --green-soft:#16261F; --orange:#E0A171;
  }
}
:root[data-theme="dark"]{
  --page:#15131C; --card:#1D1A28; --border:#2F2B3E; --secondary:#242031;
  --text-primary:#F1EFF6; --text-secondary:#C7C1D5; --text-muted:#8A82A0;
  --cherry:#E9819C; --cherry-soft:#2B1A21; --cherry-border:#5A3442;
  --violet:#AB92D4; --violet-soft:#241D33; --violet-border:#463A62;
  --green:#5FBE95; --green-soft:#16261F; --orange:#E0A171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-secondary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.shell{display:flex;gap:0;max-width:1160px;margin:0 auto;align-items:flex-start}
@media(max-width:900px){.shell{flex-direction:column}}
main{flex:1;min-width:0;padding-block:28px 72px;padding-left:20px;padding-right:20px}
aside{width:280px;flex-shrink:0;border-left:1px solid var(--border);
  padding-block:24px 40px;padding-left:16px;padding-right:16px}
@media(max-width:900px){aside{width:100%;border-left:0;border-top:1px solid var(--border)}}

/* 머리 — 원본의 뱃지·제목·메타줄 */
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;
  font-size:10px;font-weight:700;background:var(--green-soft);color:var(--green);margin-bottom:12px}
h1{margin:0 0 16px;font-size:28px;font-weight:800;color:var(--text-primary);
  letter-spacing:-.5px;line-height:1.2}
@media(max-width:600px){h1{font-size:20px}}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.langs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;
  background:var(--card);flex-shrink:0}
.langs button{border:0;background:transparent;font-family:inherit;cursor:pointer;
  padding:6px 13px;font-size:12px;font-weight:600;color:var(--text-muted)}
.langs button[aria-pressed="true"]{background:var(--text-primary);color:var(--card)}
.langs button:focus-visible{outline:2px solid var(--cherry);outline-offset:-2px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;
  color:var(--text-muted);margin-bottom:32px}
.meta .dot{color:var(--border)}
.meta .draft{color:var(--orange);font-weight:600}

/* 구획 머리 — 원본 그대로 */
section{margin-bottom:40px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sechead span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--text-muted);white-space:nowrap}
.sechead .rule{flex:1;height:1px;background:var(--border)}

/* 01 개요 — 두 줄 */
.overview{font-size:16px;line-height:1.75;color:var(--text-secondary);margin:0}

/* 02 그림 */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:700px){.figs{grid-template-columns:1fr}}
figure{margin:0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;
  display:flex;flex-direction:column}
.figtag{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--cherry)}
figure h3{margin:2px 0 8px;font-size:14px;font-weight:600;color:var(--text-primary)}
figure svg{display:block;width:100%;height:auto;margin-block:auto}
figcaption{margin-top:10px;font-size:12px;line-height:1.6;color:var(--text-muted);text-align:center}
.sv-box{fill:var(--card);stroke:var(--border);stroke-width:1.6}
.sv-line{stroke:var(--text-muted);stroke-width:1.5;fill:none;stroke-linecap:round}
.sv-ink{fill:var(--text-primary)} .sv-dim{fill:var(--text-muted)}
.sv-ch{stroke:var(--cherry);fill:none;stroke-width:1.5;stroke-linecap:round} .sv-ch-t{fill:var(--cherry)}
.sv-ch-b{fill:var(--cherry-soft);stroke:var(--cherry-border);stroke-width:1.4}
.sv-vi-b{fill:var(--violet-soft);stroke:var(--violet-border);stroke-width:1.4}
.sv-vi-f{fill:var(--violet)} .sv-vi-t{fill:var(--violet)}
.sv-gr-b{fill:var(--green-soft);stroke:var(--green);stroke-width:1.5}
.sv-gr-t{fill:var(--green)} .sv-gr-l{stroke:var(--green);fill:none;stroke-width:1.5;stroke-linecap:round}

/* 03 체리 — 원본 카드(왼쪽 3px 체리색) */
.cherry{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--cherry);
  border-radius:8px;padding:16px;margin-bottom:10px}
.cherry .who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:12px;
  font-weight:700;color:var(--text-primary);margin-bottom:8px}
.cherry .who .role{font-weight:400;color:var(--text-muted)}
.cherry q{display:block;quotes:none;font-size:15px;line-height:1.65;color:var(--text-primary)}
.cherry .cite{margin:8px 0 0;font-size:10px;color:var(--text-muted)}
.cherry .cite a{color:var(--cherry);text-decoration:none}
.cherry .cite a:hover{text-decoration:underline}

/* 04 하위 개념 — 원본 2열 카드 + 관계색 + FULL/OUTLINE 뱃지 */
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:600px){.kids{grid-template-columns:1fr}}
.kid{position:relative;background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:12px 56px 12px 12px;text-align:left;font-family:inherit;cursor:pointer}
.kid.has{border-color:var(--violet-border)} .kid.outline{border-style:dashed}
.kid:hover{border-color:var(--cherry)}
.kid .st{position:absolute;top:8px;right:8px;padding:1px 6px;border-radius:4px;border:1px solid;
  font-size:8px;font-weight:800;letter-spacing:.5px}
.kid .st.full{background:var(--violet-soft);color:var(--violet);border-color:var(--violet-border)}
.kid .st.out{background:var(--secondary);color:var(--text-muted);border-color:var(--border)}
.kid .rel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kid .nm{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--text-primary)}
.kid .why{margin:2px 0 0;font-size:11px;color:var(--text-muted)}

/* 05 레퍼런스 — 원본 타임라인 */
.ref{position:relative;padding-left:16px;border-left:2px solid var(--border);margin-bottom:16px}
.ref:first-child{border-left-color:var(--cherry)}
.ref .pin{position:absolute;left:-5px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--border)}
.ref:first-child .pin{background:var(--cherry)}
.ref .stage{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)}
.ref:first-child .stage{color:var(--cherry)}
.ref a.t{display:block;margin-top:2px;font-size:13px;font-weight:700;color:var(--text-primary);
  text-decoration:none;text-underline-offset:2px}
.ref a.t:hover{color:var(--cherry);text-decoration:underline dotted}
.ref p{margin:4px 0 0;font-size:11.5px;color:var(--text-muted)}
.ref .kind{margin-top:3px;font-size:10px;color:var(--text-muted)}

/* 오른쪽 — Learning Roadmap 카드 (원본) */
.rmcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.rmcard .h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--text-muted);margin:0 0 12px}
.rmcard svg{display:block;width:100%;height:auto}
.legend{margin-top:8px;display:grid;gap:4px;font-size:9px;color:var(--text-muted)}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.rm-self{fill:var(--card);stroke:var(--cherry);stroke-width:2}
.rm-deep{fill:var(--violet-soft);stroke:var(--violet-border);stroke-width:1.5}
.rm-pre{fill:var(--secondary);stroke:var(--border);stroke-width:1.5}
.rm-arrow{stroke:var(--border);stroke-width:1.5;fill:none}
.rm-head{fill:var(--border)} .rm-band{fill:var(--text-muted)} .rm-t{fill:var(--text-primary)} .rm-vt{fill:var(--violet)}
</style>

<div class="shell">
  <main>
    <span class="badge" id="badge">ADVANCED</span>
    <div class="titlerow">

    </div>
    <div class="meta" id="meta"></div>

    <section>
      <div class="sechead"><span>01 — Overview</span><div class="rule"></div></div>
      <p class="overview" id="overview"></p>

    <section>
      <div class="sechead"><span>02 — Flash</span><div class="rule"></div></div>
      <div class="figs" id="figs"></div>

    <section>

    </section>

    <section>

      <div class="kids" id="kids"></div>

    <section>

  </main>

        <div><i style="border:1px solid var(--border);background:var(--secondary)"></i><span>Gray = Prerequisite</span></div>
      </div>
    </div>
  </aside>
</div>

<script>

const CHERRIES = [

  { who:"Hong et al.", role:{ko:"MetaGPT · 2023",en:"MetaGPT · 2023"},

  { who:"Wu et al.", role:{ko:"AutoGen · 2023",en:"AutoGen · 2023"},
    q:{ko:"에이전트들이 서로 대화하며 일을 끝낸다.",

    cite:"Wu et al., “AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation”, Abstract (arXiv:2308.08155)", url:"https://arxiv.org/abs/2308.08155" },
];

const KIDS = [
  { rel:"SUBTOPIC", node:"Planner", label:"Planner", has:false,

  ko:{ meta:["Updated 2026-10-06","5 cherries","Draft — pending review","via 외부 자료"],
       overview:"멀티에이전트 오케스트레이션은 에이전트들 위에서 누가 언제 무엇을 어떤 권한으로 하는지 정하는 제어 계층이다.<br>에이전트를 몇 개 두느냐가 아니라 이 계층을 어떻게 짜느냐가 결과와 비용을 가른다." },

const SELF_NODE = "MultiAgentOrchestration";

/* Learning Roadmap — concept-reader-page.tsx 의 ConceptRoadmap 을 그대로 옮긴다.
   띠·관계 매핑·배치·폰트 축소·화살표 모두 기존 화면과 같다. 색만 테마 토큰을 쓴다. */
const ROADMAP_BANDS = [
  { title:"Prerequisites", rel:["PREREQUISITE"],            pos:"above" },
  { title:"Go deeper",     rel:["SUBTOPIC","EXTENDS"],      pos:"below" },
  { title:"Related",       rel:["RELATED","CONTRADICTS"],   pos:"below" },
];
const RM = { W:200, PAD:4, GAP:6, FS:11, CHAR_W:0.56, PAD_X:9, LINE_H:14, CHIP_PAD_Y:9,
  ROW_GAP:7, BAND_LABEL_H:22, BAND_FS:10, BAND_GAP:18,
  SELF_MIN_W:96, SELF_FS:15, SELF_MIN_FS:10, SELF_PAD_X:12, SELF_PAD_Y:12,
  CHIP_MIN_FS:8, ARROW:22 };

function breakPoints(s){ const idx=[];
  for(let i=1;i<s.length;i++){ if(s[i]===" ")idx.push(i);
    else if(/[a-z0-9]/.test(s[i-1])&&/[A-Z]/.test(s[i]))idx.push(i); } return idx; }
function wrapLabelAt(label, maxTextW, fs){
  const w=(t)=>t.length*fs*RM.CHAR_W;
  if(w(label)<=maxTextW) return [label];
  const bps=breakPoints(label); const lines=[]; let start=0;
  while(start<label.length){
    const rest=label.slice(start);
    if(w(rest)<=maxTextW){ lines.push(rest.trim()); break; }
    const cand=bps.filter(b=>b>start&&w(label.slice(start,b))<=maxTextW);
    if(!cand.length){ const n=Math.max(1,Math.floor(maxTextW/(fs*RM.CHAR_W)));
      lines.push(label.slice(start,start+n).trim()); start+=n; }
    else { const b=cand[cand.length-1]; lines.push(label.slice(start,b).trim()); start=b; }
  }
  return lines.filter(Boolean);
}
function fitText(label, maxTextW, maxFS, minFS){
  const w=(t,fs)=>t.length*fs*RM.CHAR_W;
  if(w(label,maxFS)<=maxTextW) return {lines:[label],fs:maxFS};
  const needed=maxTextW/(label.length*RM.CHAR_W);
  if(needed>=minFS) return {lines:[label],fs:Math.floor(needed*10)/10};
  return {lines:wrapLabelAt(label,maxTextW,minFS),fs:minFS};
}
function roadmap(){
  const inner=RM.W-RM.PAD*2;
  const makeChip=(c)=>{ const maxTextW=inner-RM.PAD_X*2;
    const {lines,fs}=fitText(c.label,maxTextW,RM.FS,RM.CHIP_MIN_FS);
    const widest=Math.max(...lines.map(l=>l.length*fs*RM.CHAR_W));
    return { node:c.node, label:c.label, hasPage:c.has, lines, fs,
      w:Math.min(inner,widest+RM.PAD_X*2), h:lines.length*(fs+3)+RM.CHIP_PAD_Y*2 }; };
  const flow=(chips)=>{ const rows=[]; let cur=[],used=0;
    for(const ch of chips){ const need=ch.w+(cur.length?RM.GAP:0);
      if(cur.length&&used+need>inner){ rows.push(cur); cur=[ch]; used=ch.w; }
      else { cur.push(ch); used+=need; } }
    if(cur.length) rows.push(cur); return rows; };
  const bands=ROADMAP_BANDS.map(b=>{
    const chips=KIDS.filter(c=>b.rel.includes(c.rel)).map(makeChip);
    const rows=flow(chips);
    const h=chips.length ? RM.BAND_LABEL_H
      + rows.reduce((s,r)=>s+Math.max(...r.map(c=>c.h)),0)
      + Math.max(0,rows.length-1)*RM.ROW_GAP : 0;
    return {...b, rows, h, count:chips.length};
  }).filter(b=>b.count>0);

  const above=bands.filter(b=>b.pos==="above"), below=bands.filter(b=>b.pos==="below");
  const sum=(l)=>l.reduce((s,b)=>s+b.h,0)+Math.max(0,l.length-1)*RM.BAND_GAP;
  const selfFit=fitText(SELF_NODE, inner-RM.SELF_PAD_X*2, RM.SELF_FS, RM.SELF_MIN_FS);
  const selfTextW=Math.max(...selfFit.lines.map(l=>l.length*selfFit.fs*RM.CHAR_W));
  const selfW=Math.min(inner,Math.max(RM.SELF_MIN_W,selfTextW+RM.SELF_PAD_X*2));
  const selfH=selfFit.lines.length*(selfFit.fs+4)+RM.SELF_PAD_Y*2;
  const selfBlock=selfH+20;
  const H=RM.PAD*2+(above.length?sum(above)+RM.ARROW:0)+selfBlock+(below.length?sum(below)+RM.ARROW:0);

  const parts=[];
  const drawBand=(b,top)=>{ let y=top+RM.BAND_LABEL_H;
    parts.push(`<text class="rm-band" x="${RM.W/2}" y="${top+11}" text-anchor="middle" font-size="${RM.BAND_FS}" font-weight="700" letter-spacing=".5">${b.title.toUpperCase()}</text>`);
    b.rows.forEach((row,ri)=>{
      const rowH=Math.max(...row.map(c=>c.h));
      const rowW=row.reduce((s,c)=>s+c.w,0)+(row.length-1)*RM.GAP;
      let x=(RM.W-rowW)/2;
      for(const c of row){ const cx=x; x+=c.w+RM.GAP;
        const cls=b.pos==="above"?"rm-pre":"rm-deep";
        parts.push(`<rect class="${cls}" x="${cx}" y="${y}" width="${c.w}" height="${c.h}" rx="7"${c.hasPage?"":' stroke-dasharray="3"'}/>`);
        c.lines.forEach((ln,li)=>parts.push(
          `<text class="${b.pos==="above"?"rm-band":"rm-vt"}" x="${cx+c.w/2}" y="${y+RM.CHIP_PAD_Y+(c.fs+3)*li+c.fs}" text-anchor="middle" font-size="${c.fs}">${ln}</text>`));
      }
      y+=rowH+(ri<b.rows.length-1?RM.ROW_GAP:0);
    });
  };
  const arrow=(y,dashed)=>{
    parts.push(`<line class="rm-arrow" x1="${RM.W/2}" y1="${y}" x2="${RM.W/2}" y2="${y+RM.ARROW-7}" stroke-width="2"${dashed?' stroke-dasharray="4"':''}/>`);
    parts.push(`<polygon class="rm-head" points="${RM.W/2-5},${y+RM.ARROW-8} ${RM.W/2+5},${y+RM.ARROW-8} ${RM.W/2},${y+RM.ARROW}"/>`);
  };

  let y=RM.PAD;
  above.forEach((b,i)=>{ drawBand(b,y); y+=b.h+(i<above.length-1?RM.BAND_GAP:0); });
  if(above.length){ arrow(y,false); y+=RM.ARROW; }
  parts.push(`<rect class="rm-self" x="${(RM.W-selfW)/2}" y="${y}" width="${selfW}" height="${selfH}" rx="8"/>`);
  selfFit.lines.forEach((ln,i)=>parts.push(
    `<text class="rm-t" x="${RM.W/2}" y="${y+RM.SELF_PAD_Y+(selfFit.fs+4)*i+selfFit.fs}" text-anchor="middle" font-size="${selfFit.fs}" font-weight="700">${ln}</text>`));
  parts.push(`<text class="rm-band" x="${RM.W/2}" y="${y+selfH+14}" text-anchor="middle" font-size="10">(you are here)</text>`);
  y+=selfBlock;
  if(below.length){ arrow(y,true); y+=RM.ARROW; }
  below.forEach((b,i)=>{ drawBand(b,y); y+=b.h+(i<below.length-1?RM.BAND_GAP:0); });
  return `<svg viewBox="0 0 ${RM.W} ${Math.ceil(H)}" role="img" xmlns="http://www.w3.org/2000/svg">${parts.join("")}</svg>`;
}

  document.getElementById("roadmap").innerHTML = roadmap();
