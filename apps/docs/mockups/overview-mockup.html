<!doctype html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cherry — Overview 목업 (에디토리얼)</title>
<style>
  :root{--cherry:#C94B6E;--ink:#1A1626;--label:#9E97B3;--line:#E4E1EE;--purple:#7B5EA7;--bg:#FBFAF9}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Apple SD Gothic Neo",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:30px 34px 70px;max-width:1180px;margin:0 auto}
  h1{font-size:30px;margin:0 0 3px;letter-spacing:-.6px;font-weight:850}
  .sub{font-size:14px;color:#6E6A78;margin:0 0 24px}

  .sec{display:flex;align-items:baseline;gap:10px;margin:72px 0 14px}
  .sec h2{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
  .sec .desc{font-size:12.5px;color:var(--label)}
  .sec .more{margin-left:auto;font-size:12.5px;font-weight:650;color:var(--purple);text-decoration:none}
  .sec .more:hover{text-decoration:underline}
  .divider{border-top:1px solid #EFEDF3;margin:46px 0 0}

  /* HERO */
  .hero{position:relative;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(280px,42%) 1fr;
    min-height:300px;text-decoration:none;color:#fff;box-shadow:0 10px 34px rgba(45,20,70,.18)}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
  .hero .left{background:linear-gradient(155deg,#3B2159 0%,#5B3D87 45%,#7B5EA7 100%);padding:30px 32px;display:flex;flex-direction:column}
  .hero .kicker{font-size:11.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.72}
  .hero h3{font-size:34px;line-height:1.12;margin:12px 0 0;font-weight:850;letter-spacing:-.8px}
  .hero .tagline{font-size:14px;line-height:1.6;opacity:.86;margin-top:12px;max-width:34ch}
  .hero .foot{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:12px;opacity:.85;padding-top:20px}
  .hero .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:4px 11px;font-weight:700}
  .hero .right{position:relative;background:linear-gradient(140deg,#6E4C9B 0%,#8A6BB8 60%,#A98FD0 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hero .right::after{content:"";position:absolute;inset:-30% -10% auto auto;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 62%)}
  .hero .bigicon{width:150px;height:150px;border-radius:34px;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 22px 50px rgba(30,10,55,.4);position:relative;z-index:1;transform:rotate(-4deg)}
  .hero .bigicon img{width:100%;height:100%;object-fit:contain;padding:22px}
  .hero .ghost{position:absolute;width:120px;height:120px;border-radius:28px;background:rgba(255,255,255,.13)}
  .g1{transform:translate(-140px,-46px) rotate(-12deg)} .g2{transform:translate(132px,54px) rotate(10deg)}

  /* 스포트라이트 (원형) */
  .spot{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.spot{grid-template-columns:1fr}}
  .scard{background:#F2F0F7;border-radius:18px;padding:24px 26px;display:flex;align-items:center;gap:20px;
    text-decoration:none;color:inherit;transition:transform .16s,box-shadow .16s}
  .scard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(40,20,70,.1)}
  .scard .txt{flex:1;min-width:0}
  .scard .k{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--label)}
  .scard h4{font-size:21px;margin:7px 0 0;font-weight:800;letter-spacing:-.4px;line-height:1.2}
  .scard p{font-size:12.5px;color:#5A5568;line-height:1.55;margin:9px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .scard .circ{width:112px;height:112px;border-radius:50%;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(40,20,70,.13)}
  .scard .circ img{width:100%;height:100%;object-fit:contain;padding:24px}

  /* 배너형 피처 (아래 블록용) — 앱스토어 '꼭 해봐야 할' 스타일 */
  .feat{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.feat{grid-template-columns:1fr}}
  .fcard{text-decoration:none;color:inherit;display:block}
  .fcard .banner{border-radius:16px;height:190px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    transition:transform .16s,box-shadow .16s}
  .fcard:hover .banner{transform:translateY(-2px);box-shadow:0 12px 30px rgba(40,20,70,.14)}
  .fcard .banner::after{content:"";position:absolute;inset:auto -12% -46% auto;width:250px;height:250px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.32),transparent 64%)}
  .fcard .bi{width:104px;height:104px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 34px rgba(25,10,45,.28);position:relative;z-index:1}
  .fcard .bi img{width:100%;height:100%;object-fit:contain;padding:17px}
  .fcard .k{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--label);margin-top:14px;display:block}
  .fcard h4{font-size:19px;margin:5px 0 0;font-weight:800;letter-spacing:-.35px}
  .fcard p{font-size:13px;color:#5A5568;line-height:1.5;margin:5px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* 목록 */
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
  @media(max-width:820px){.rows{grid-template-columns:1fr}}
  .row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #EFEDF3;text-decoration:none;color:inherit}
  .row:hover .nm{color:var(--purple)}
  .row .av{width:52px;height:52px;border-radius:13px;flex-shrink:0;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .row .av img{width:100%;height:100%;object-fit:contain;padding:9px}
  .row .mid{flex:1;min-width:0}
  .row .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s}
  .row .meta{font-size:11.5px;color:var(--label);margin-top:2px}
  .row .star{font-size:11.5px;font-weight:750;color:#C7791B;flex-shrink:0}
  .note{margin-top:48px;font-size:12.5px;color:#8A8694;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
</style></head><body>
  <h1>Newly Discovered</h1>
  <p class="sub">Editor's Choice</p>
  <div id="app"></div>
  <p class="note">
    <b>구조</b> — 앱스토어처럼 <b>위계가 아래로도 반복</b>됩니다.
    히어로 → 스포트라이트 2 → 목록 → <b>배너 피처 2 → 목록</b> → 배너 피처 2 → 목록 → 목록.
    분야가 바뀔 때마다 리듬을 다시 시작해 스크롤이 지루하지 않게 합니다. 실제 데이터·아이콘 기준.
  </p>
<script>
const D = {"hero": {"n": "Superpowers", "i": "002fa984156e", "d": "a complete software-development methodology for coding agents built on a set of composable Claude Code skills, automating design refinement, implementation planning, and test-driven development.", "s": 254842, "ty": "skill", "tp": "skill", "u": "https://github.com/obra/superpowers"}, "spotlight": [{"n": "andrej-karpathy-skills", "i": "386a5f98e4fb", "d": "a drop-in Claude Code skill (a single CLAUDE.md) distilling Andrej Karpathy's observations on LLM coding pitfalls into four principles - think before coding, prioritize simplicity, make surgical changes only, and execute with clear success criteria.", "s": 192340, "ty": "skill", "tp": "skill", "u": "https://github.com/multica-ai/andrej-karpathy-skills"}, {"n": "UI UX Pro Max", "i": "38704f011eb3", "d": "an AI skill providing design intelligence for building professional UI/UX across platforms - 84 UI styles, 192 color palettes, and 161 reasoning rules for industry-specific design-system generation.", "s": 105676, "ty": "skill", "tp": "skill", "u": "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"}], "fresh": [{"n": "Claude Scientific Skills", "i": "c4d0bb4ab603", "d": "a collection of 148 pre-built scientific skills enabling AI agents to execute research workflows across biology, chemistry, medicine, and drug discovery with access to 100+ scientific databases.", "s": 30919, "ty": "skill", "tp": "skill", "u": "https://github.com/K-Dense-AI/scientific-agent-skills"}, {"n": "Humanizer", "i": "44e41613f9d6", "d": "an agent skill that detects and removes 33 patterns of AI-generated writing to make text sound more natural and human.", "s": 29231, "ty": "skill", "tp": "skill", "u": "https://github.com/blader/humanizer"}, {"n": "Anthropic Cybersecurity Skills", "i": "138ce7d722a3", "d": "an open-source AI-native knowledge base of 817 structured cybersecurity skills for agents (Claude Code, Copilot), mapped across MITRE ATT&CK, NIST CSF 2.0, ATLAS, D3FEND, NIST AI RMF, and F3, spanning 29 security domains.", "s": 25580, "ty": "skill", "tp": "skill", "u": "https://github.com/mukul975/Anthropic-Cybersecurity-Skills"}, {"n": "SkillSpector", "i": "4fd0dc70a409", "d": "an NVIDIA security scanner that audits AI agent skills before installation, running fast static pattern matching plus optional LLM semantic evaluation across 68 vulnerability patterns in 17 categories to produce risk scores and recommendations.", "s": 13182, "ty": "other", "tp": "skill", "u": "https://github.com/NVIDIA/SkillSpector"}, {"n": "Dev Browser", "i": "193c21001015", "d": "'A Claude Skill to give your agent the ability to use a web browser' — sandbox-protected JavaScript execution with full Playwright API support, persistent page navigation, and automatic Chrome connection.", "s": 6435, "ty": "skill", "tp": "skill", "u": "https://github.com/SawyerHood/dev-browser"}, {"n": "n8n Skills", "i": "d3c1970b500b", "d": "a collection of 14 Claude Code skills that help AI assistants build production-ready n8n automation workflows by teaching correct syntax, MCP tool usage, and proven patterns.", "s": 5792, "ty": "skill", "tp": "skill", "u": "https://github.com/czlonkowski/n8n-skills"}], "b2": {"title": "Pick an MCP Server", "kicker": "CONNECT ANYTHING", "feature": [{"n": "MarkItDown", "i": "80e8ccffad76", "d": "Python tool for converting files and office documents to Markdown; ships an MCP server (markitdown-mcp) for LLM consumption.", "s": 165197, "ty": "server", "tp": "mcp", "u": "https://github.com/microsoft/markitdown"}, {"n": "Netdata MCP Server", "i": "35290d7d070e", "d": "Netdata's MCP server for discovery, exploration, reporting and root-cause analysis across metrics, logs, systems and containers.", "s": 79626, "ty": "server", "tp": "mcp", "u": "https://github.com/netdata/netdata"}], "list": [{"n": "serena", "i": "b34aac060269", "d": "A powerful MCP toolkit for coding, providing semantic retrieval and editing capabilities - the IDE for your agent.", "s": 26379, "ty": "server", "tp": "mcp", "u": "https://github.com/oraios/serena"}, {"n": "Screenpipe", "i": "d3c2340a7c02", "d": "AI that knows what you've seen, said, or heard: records screen and audio 24/7 locally and privately, with timestamped indexing and semantic search, exposed to LLMs/agents (including via MCP).", "s": 19802, "ty": "server", "tp": "mcp", "u": "https://github.com/mediar-ai/screenpipe"}, {"n": "DesktopCommanderMCP", "i": "40604f262812", "d": "MCP server for Claude that gives it terminal control, file system search, and diff-based file editing capabilities.", "s": 8059, "ty": "server", "tp": "mcp", "u": "https://github.com/wonderwhy-er/DesktopCommanderMCP"}, {"n": "awesome-mcp-clients", "i": "2f8ec87e5bf7", "d": "A collection of MCP clients — a curated companion list cataloging MCP client applications.", "s": 6514, "ty": "registry", "tp": "mcp", "u": "https://github.com/punkpeye/awesome-mcp-clients"}]}, "b3": {"title": "Build Your Agent", "kicker": "BUILD YOUR AGENT", "feature": [{"n": "Mem0", "i": "d99da34c35ca", "d": "Verified from the article: a semantic graph memory framework (mem0.ai) that extracts and maintains user-specific preferences and habits across chat streams via autonomous semantic auto-merges with no manual review.", "s": 60792, "ty": "framework", "tp": "agent", "u": "https://github.com/mem0ai/mem0"}, {"n": "AgentGPT", "i": "6fcd1165a59a", "d": "browser-based autonomous-agent platform (beta) by Reworkd AI that lets users configure and deploy agents toward a goal, with pre-built templates for research reports, travel planning, and study plans.", "s": 36274, "ty": "platform", "tp": "agent", "u": "https://agentgpt.reworkd.ai/"}], "list": [{"n": "Deep Agents", "i": "2ba7d53b3693", "d": "Open-source LangChain agent framework providing an opinionated agent that runs out of the box with filesystem access, sub-agents, context management, and skill loading.", "s": 26205, "ty": "framework", "tp": "agent", "u": "https://github.com/langchain-ai/deepagents"}, {"n": "LocalGPT", "i": "08f6788189a1", "d": "chat with your documents on your local device using GPT models, with no data leaving the device and 100% private.", "s": 22202, "ty": "product", "tp": "agent", "u": "https://github.com/PromtEngineer/localGPT"}, {"n": "Smol Developer", "i": "eee546c2d2ff", "d": "the first library to let you embed a junior AI developer agent in your own app, scaffolding codebases from a prompt.", "s": 12192, "ty": "framework", "tp": "agent", "u": "https://github.com/smol-ai/developer"}, {"n": "Self-Operating Computer", "i": "f624cc8796e0", "d": "Verified from the resolved GitHub repo (HyperWrite/OthersideAI's project): a framework to enable a multimodal model to operate a computer via the screen and mouse/keyboard.", "s": 10245, "ty": "framework", "tp": "agent", "u": "https://github.com/OthersideAI/self-operating-computer"}]}, "b4": {"title": "Working with Prompts", "list": [{"n": "prompts.chat", "i": "37e64e1b36bb", "d": "prompts.chat (formerly 'Awesome ChatGPT Prompts') is a curated collection/database of prompt examples for AI chat models, published as a browsable site, CSV file, Hugging Face dataset, CLI tool, and MCP server.", "s": 165659, "ty": "dataset", "tp": "prompt", "u": "https://github.com/f/prompts.chat"}, {"n": "Prompt Engineering Guide", "i": "394209b8faac", "d": "the Prompt Engineering Guide is an open-source collection of guides, papers, lessons, notebooks and resources for prompt engineering, context engineering, RAG and AI agents (zero/few-shot, chain-of-thought, ReAct, adversarial prompting, etc.), hosted at promptingguide.ai.", "s": 76442, "ty": "guide", "tp": "prompt", "u": "https://github.com/dair-ai/Prompt-Engineering-Guide"}, {"n": "GEPA", "i": "78ac02bbd640", "d": "Verified from the abstract page: GEPA (Genetic-Pareto), a prompt optimization technique using reflective natural-language evolution instead of reinforcement learning — it samples trajectories, reflects on failures in plain language, proposes/tests prompt mutations, and combines complementary variants via a Pareto frontier of successful attempts; reported to beat GRPO by 6% on average (up to 20% on individual tasks) using 35x fewer rollouts, and to exceed MIPROv2 by over 10%.", "s": 5633, "ty": "technique", "tp": "prompt", "u": "https://arxiv.org/abs/2507.19457"}, {"n": "Purple Llama", "i": "3867da8af2f6", "d": "Meta's umbrella project of open tools and evals (e.g. CyberSecEval, input/output safeguards) for building responsibly with generative-AI models, including prompt-injection tests.", "s": 4278, "ty": "tool", "tp": "prompt", "u": "https://github.com/meta-llama/PurpleLlama"}, {"n": "Pezzo", "i": "8abac5185f89", "d": "Verified from the resolved GitHub repo (pezzo.ai's source): an open-source, developer-first LLMOps/prompt-ops toolkit for prompt design, version management, delivery, collaboration, troubleshooting, and observability.", "s": 3253, "ty": "tool", "tp": "prompt", "u": "https://github.com/pezzolabs/pezzo"}, {"n": "NanoBanana Trending Prompts", "i": "ba27f8cb6b40", "d": "a community-curated, engagement-ranked collection of 1,400+ trending AI image-generation prompts sourced from X, compatible with multiple image-generation platforms.", "s": 676, "ty": "library", "tp": "prompt", "u": "https://github.com/jau123/nanobanana-trending-prompts"}]}};
const fmtS=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':n;
const TY={server:'Server',skill:'Skill',product:'Product',platform:'Platform',framework:'Framework',guide:'Guide',
  technique:'Technique',tool:'Tool',marketplace:'Marketplace',library:'Library',dataset:'Dataset',
  client_sdk:'Client SDK',registry:'Registry',spec:'Spec',benchmark:'Benchmark',other:'Other'};
const TP={agent:'Agent',mcp:'MCP',prompt:'Prompt',skill:'Skill'};
const ic=s=>`<img src="icons/${s}.png" alt="" onerror="this.style.display='none'">`;
const GRAD=[ 'linear-gradient(140deg,#4B78F0,#7BA0F7)', 'linear-gradient(140deg,#2E8B6F,#6FBFA5)',
             'linear-gradient(140deg,#7B5EA7,#A98FD0)', 'linear-gradient(140deg,#D4854A,#EFB483)' ];

const rows = arr => `<div class="rows">${arr.map(x=>`
  <a class="row" href="${x.u}" target="_blank" rel="noopener">
    <span class="av">${ic(x.i)}</span>
    <span class="mid"><span class="nm">${x.n}</span><span class="meta">${TP[x.tp]} · ${TY[x.ty]}</span></span>
    ${x.s?`<span class="star">★ ${fmtS(x.s)}</span>`:''}
  </a>`).join('')}</div>`;

const feat = (arr,gi) => `<div class="feat">${arr.map((x,i)=>`
  <a class="fcard" href="${x.u}" target="_blank" rel="noopener">
    <div class="banner" style="background:${GRAD[(gi+i)%GRAD.length]}"><span class="bi">${ic(x.i)}</span></div>
    <span class="k">${TP[x.tp]} · ${TY[x.ty]}</span>
    <h4>${x.n}</h4>
    <p>${x.d.slice(0,90)}</p>
  </a>`).join('')}</div>`;

const h=D.hero;
document.getElementById('app').innerHTML = `
  <a class="hero" href="${h.u}" target="_blank" rel="noopener">
    <div class="left">
      <div class="kicker">Pick of the week</div>
      <h3>${h.n}</h3>
      <p class="tagline">${h.d.slice(0,120)}</p>
      <div class="foot"><span class="pill">★ ${fmtS(h.s)}</span><span>${TP[h.tp]} · ${TY[h.ty]}</span>
        <span style="margin-left:auto">Learn more →</span></div>
    </div>
    <div class="right"><span class="ghost g1"></span><span class="ghost g2"></span><span class="bigicon">${ic(h.i)}</span></div>
  </a>

  <div class="sec"><h2>Worth a Look</h2><span class="desc">Standouts this week</span></div>
  <div class="spot">${D.spotlight.map(x=>`
    <a class="scard" href="${x.u}" target="_blank" rel="noopener">
      <span class="txt"><span class="k">${TP[x.tp]} · ${TY[x.ty]}</span><h4>${x.n}</h4><p>${x.d.slice(0,110)}</p></span>
      <span class="circ">${ic(x.i)}</span>
    </a>`).join('')}</div>

  <div class="sec"><h2>Just Added</h2><span class="desc">Most recent updates</span></div>
  ${rows(D.fresh)}

  <div class="sec"><h2>${D.b2.title}</h2></div>
  ${feat(D.b2.feature,0)}
  <div style="height:26px"></div>
  ${rows(D.b2.list)}

  <div class="sec"><h2>${D.b3.title}</h2></div>
  ${feat(D.b3.feature,2)}
  <div style="height:26px"></div>
  ${rows(D.b3.list)}

  <div class="sec"><h2>${D.b4.title}</h2></div>
  ${rows(D.b4.list)}
`;
</script></body></html>
