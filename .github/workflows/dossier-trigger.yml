name: Trigger brain dossier rebuild
on:
  push:
    branches: [main, master]
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.BRAIN_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HangryDev/00-company-brain-foundation/dispatches \
            -d '{"event_type":"dossier-rebuild"}'
